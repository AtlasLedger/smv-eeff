# Publica la página (site/) con los CSV de data/ en GitHub Pages.
# Se dispara al cambiar la página y al terminar la actualización mensual de datos
# (un push hecho por el bot con GITHUB_TOKEN no dispara otros workflows, por eso workflow_run).
name: pagina

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/generar_sitio.py"]
  workflow_run:
    workflows: [actualizar]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow
      - name: Armar el sitio
        run: |
          mkdir -p _sitio/data _sitio/docs _sitio/mapeo _sitio/validacion
          cp site/index.html _sitio/
          cp -r data/csv _sitio/data/
          cp data/metadatos.json data/calidad.json _sitio/data/
          cp docs/diccionario.md _sitio/docs/
          cp mapeo/*.csv mapeo/DECISIONES.md _sitio/mapeo/
          cp validacion/reporte.md _sitio/validacion/
          python scripts/generar_sitio.py --data data --salida _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
